<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="turnstile-sitekey" content="test-only-site-key">
  <title>Local preview - report requests are not sent</title>
  <link rel="icon" href="/img/icons/adobe-logo.svg">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/report-request-form/report-request-form.css">
</head>
<body>
  <header></header>
  <main>
    <div class="section"><div class="block-content"><div class="report-request-form"></div></div></div>
  </main>
  <script type="module">
    import init from '/blocks/report-request-form/report-request-form.js';

    let verified;
    window.turnstile = {
      render: (_holder, options) => { verified = options.callback; return 'local-fixture'; },
      execute: () => verified('local-fixture-token'),
      reset: () => {},
    };
    const originalFetch = window.fetch.bind(window);
    window.fetch = (url, options) => {
      if (url === 'https://act.aem.now/api/report-requests') {
        window.fixtureSubmission = JSON.parse(options.body);
        return Promise.resolve(new Response('{"requestId":"local-preview-only"}', {
          status: 201, headers: { 'Content-Type': 'application/json' },
        }));
      }
      return originalFetch(url, options);
    };
    init(document.querySelector('.report-request-form'));
  </script>
</body>
</html>
